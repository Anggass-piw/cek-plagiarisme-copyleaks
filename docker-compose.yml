services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "8000"
    restart: unless-stopped
  caddy:
    image: caddy:2
    env_file: .env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
